services:
  postgres:
    image: postgres:16-alpine
    container_name: shopsphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-shopsphere}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - shopsphere_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopsphere}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsphere-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-shopsphere}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-docker_dev_access_secret_minimum_32_characters_long_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-docker_dev_refresh_secret_minimum_32_characters_long_2026}
      CSRF_SECRET: ${CSRF_SECRET:-docker_dev_csrf_secret_minimum_32_characters_long_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
    ports:
      - "${BACKEND_PORT:-4000}:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  shopsphere_pgdata:
